name: Continuous Integration

on:
  pull_request:

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-and-scan:
    name: Test, build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: careflow
          POSTGRES_USER: careflow
          POSTGRES_PASSWORD: careflow_ci

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U careflow -d careflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3100
      APP_VERSION: ci-${{ github.sha }}
      DATABASE_URL: postgresql://careflow:careflow_ci@127.0.0.1:5432/careflow
      CI_IMAGE: careflow-api:${{ github.sha }}

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: application/package-lock.json

      - name: Install application dependencies
        working-directory: application
        run: npm ci

      - name: Run unit tests
        working-directory: application
        run: npm test

      - name: Compile TypeScript
        working-directory: application
        run: npm run build

      - name: Apply database migrations
        working-directory: application
        run: npm run db:migrate

      - name: Run end-to-end smoke test
        run: ./scripts/smoke-test.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build hardened container image
        uses: docker/build-push-action@v7
        with:
          context: ./application
          load: true
          push: false
          tags: ${{ env.CI_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.CI_IMAGE }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Verify non-root container runtime
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_USER="$(
            docker image inspect \
              "$CI_IMAGE" \
              --format '{{.Config.User}}'
          )"

          echo "Configured container user: $IMAGE_USER"

          test "$IMAGE_USER" = "node"
