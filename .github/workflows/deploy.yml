name: Continuous Deployment

on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: careflow-dev-deployment
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2

  ECR_REPOSITORY: careflow/dev/careflow-api

  ECS_CLUSTER: careflow-dev-cluster
  ECS_SERVICE: careflow-dev-careflow-api
  ECS_TASK_FAMILY: careflow-dev-careflow-api
  CONTAINER_NAME: careflow-api

jobs:
  deploy:
    name: Build and deploy to ECS

    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )

    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out tested source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: CareFlow-${{ github.run_id }}
          allowed-account-ids: 943939515134

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push application image
        uses: docker/build-push-action@v7
        with:
          context: ./application
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render ECS task definition
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1.8.5
        with:
          task-definition-family: ${{ env.ECS_TASK_FAMILY }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          environment-variables: |
            APP_VERSION=${{ env.RELEASE_SHA }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

      - name: Verify public CareFlow health
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 8 \
              --retry-delay 5 \
              --retry-all-errors \
              "${{ vars.CAREFLOW_PUBLIC_URL }}/health/ready"
          )"

          echo "$RESPONSE"
          echo "Public CareFlow health check passed."

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "# CareFlow Deployment"
            echo
            echo "AWS authentication: OIDC"
            echo
            echo "Container registry: Amazon ECR"
            echo
            echo "Deployment target: Amazon ECS Fargate"
            echo
            echo "Service status: stable"
            echo
            echo "Public health check: passed"
            echo
            echo "**Release:** \`${RELEASE_SHA}\`"
            echo
            echo "**Image:** \`${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
