name: ECS Rollback Drill

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RUN_ROLLBACK_DRILL to confirm"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: careflow-rollback-drill
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  ECS_CLUSTER: careflow-dev-cluster
  ECS_SERVICE: careflow-dev-careflow-api
  ECS_TASK_FAMILY: careflow-dev-careflow-api
  CONTAINER_NAME: careflow-api

jobs:
  rollback-drill:
    name: Controlled failure and automatic rollback
    if: ${{ inputs.confirm == 'RUN_ROLLBACK_DRILL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Show GitHub OIDC claims
        uses: actions/github-script@v9
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com')

            const payload = token.split('.')[1]

            const claims = JSON.parse(
              Buffer.from(payload, 'base64url').toString('utf8')
            )

            const keys = [
              'sub',
              'aud',
              'repository',
              'repository_id',
              'repository_owner',
              'repository_owner_id',
              'ref',
              'event_name',
              'workflow_ref'
            ]

            core.info('=== GitHub OIDC claims ===')

            for (const key of keys) {
              core.info(`${key}: ${claims[key] ?? ''}`)
            }

      - name: Authenticate to AWS using OIDC
        id: aws-auth
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: RollbackDrill-${{ github.run_id }}
          allowed-account-ids: 943939515134

      - name: Capture healthy baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail

          TASK_DEFINITION="$(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query 'services[0].taskDefinition' \
              --output text
          )"

          IMAGE="$(
            aws ecs describe-task-definition \
              --task-definition "$TASK_DEFINITION" \
              --query "taskDefinition.containerDefinitions[?name=='${CONTAINER_NAME}'].image | [0]" \
              --output text
          )"

          echo "task_definition=$TASK_DEFINITION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          echo "=== Healthy baseline ==="
          echo "Task definition: $TASK_DEFINITION"
          echo "Image: $IMAGE"

      - name: Render deliberately unhealthy task definition
        id: broken-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1.8.5
        with:
          task-definition-arn: ${{ steps.baseline.outputs.task_definition }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.baseline.outputs.image }}
          environment-variables: |
            PORT=3999
            APP_VERSION=rollback-drill-${{ github.run_id }}

      - name: Deploy unhealthy revision
        id: deploy-broken
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.broken-task.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: false

      - name: Record broken revision
        id: broken
        shell: bash
        run: |
          set -euo pipefail

          BROKEN_TASK_DEFINITION="$(
            aws ecs describe-task-definition \
              --task-definition "$ECS_TASK_FAMILY" \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text
          )"

          echo "task_definition=$BROKEN_TASK_DEFINITION" >> "$GITHUB_OUTPUT"

          echo "=== Deliberately unhealthy revision ==="
          echo "$BROKEN_TASK_DEFINITION"

      - name: Wait for ECS automatic rollback
        id: rollback
        shell: bash
        env:
          BASELINE: ${{ steps.baseline.outputs.task_definition }}
          BROKEN: ${{ steps.broken.outputs.task_definition }}
        run: |
          set -euo pipefail

          echo "=== Waiting for broken deployment to become PRIMARY ==="

          BROKEN_SEEN=false

          for attempt in $(seq 1 30); do
            PRIMARY="$(
              aws ecs describe-services \
                --cluster "$ECS_CLUSTER" \
                --services "$ECS_SERVICE" \
                --query "services[0].deployments[?status=='PRIMARY'].taskDefinition | [0]" \
                --output text
            )"

            echo "Attempt ${attempt}/30"
            echo "Primary: $PRIMARY"

            if [ "$PRIMARY" = "$BROKEN" ]; then
              BROKEN_SEEN=true
              echo
              echo "Broken revision observed as PRIMARY."
              break
            fi

            sleep 5
          done

          if [ "$BROKEN_SEEN" != "true" ]; then
            echo "Broken revision never became the PRIMARY deployment."
            exit 1
          fi

          echo
          echo "=== Waiting for deployment circuit breaker rollback ==="

          for attempt in $(seq 1 90); do
            PRIMARY="$(
              aws ecs describe-services \
                --cluster "$ECS_CLUSTER" \
                --services "$ECS_SERVICE" \
                --query "services[0].deployments[?status=='PRIMARY'].taskDefinition | [0]" \
                --output text
            )"

            RUNNING="$(
              aws ecs describe-services \
                --cluster "$ECS_CLUSTER" \
                --services "$ECS_SERVICE" \
                --query 'services[0].runningCount' \
                --output text
            )"

            PENDING="$(
              aws ecs describe-services \
                --cluster "$ECS_CLUSTER" \
                --services "$ECS_SERVICE" \
                --query 'services[0].pendingCount' \
                --output text
            )"

            echo "Attempt ${attempt}/90"
            echo "Primary: $PRIMARY"
            echo "Running: $RUNNING"
            echo "Pending: $PENDING"

            if [ "$PRIMARY" = "$BASELINE" ] &&
               [ "$RUNNING" -ge 1 ] &&
               [ "$PENDING" -eq 0 ]; then

              echo "rollback_verified=true" >> "$GITHUB_OUTPUT"

              echo
              echo "Automatic rollback VERIFIED."
              echo "Healthy baseline restored:"
              echo "$BASELINE"

              exit 0
            fi

            sleep 10
          done

          echo
          echo "Automatic rollback was not verified within the expected time."
          exit 1

      - name: Show ECS deployment evidence
        if: ${{ always() && steps.aws-auth.outcome == 'success' }}
        shell: bash
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{
              TaskDefinition:taskDefinition,
              Desired:desiredCount,
              Running:runningCount,
              Pending:pendingCount,
              CircuitBreaker:deploymentConfiguration.deploymentCircuitBreaker,
              Deployments:deployments[].{
                Status:status,
                TaskDefinition:taskDefinition,
                RolloutState:rolloutState,
                RolloutReason:rolloutStateReason,
                Running:runningCount,
                Pending:pendingCount
              },
              RecentEvents:events[0:10].[createdAt,message]
            }' \
            --output json

      - name: Verify public service health
        id: public-health
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Public service health ==="

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            "${{ vars.CAREFLOW_PUBLIC_URL }}/health/ready"

          echo
          echo "Public CareFlow endpoint remains healthy."

      - name: Publish rollback drill summary
        if: always()
        shell: bash
        run: |
          {
            echo "# CareFlow ECS Rollback Drill"
            echo
            echo "## Fault injection"
            echo
            echo "Application PORT changed from **3000 → 3999**."
            echo
            echo "This deliberately caused the new ECS tasks to fail health checks."
            echo
            echo "## Healthy baseline"
            echo
            echo "\`${{ steps.baseline.outputs.task_definition }}\`"
            echo
            echo "## Broken revision"
            echo
            echo "\`${{ steps.broken.outputs.task_definition }}\`"
            echo
            echo "## Results"
            echo
            echo "- AWS OIDC authentication: **${{ steps.aws-auth.outcome }}**"
            echo "- Broken revision deployment: **${{ steps.deploy-broken.outcome }}**"
            echo "- Automatic rollback verification: **${{ steps.rollback.outcome }}**"
            echo "- Public service health: **${{ steps.public-health.outcome }}**"
            echo
            echo "## Public endpoint"
            echo
            echo "\`${{ vars.CAREFLOW_PUBLIC_URL }}\`"
            echo
            echo "The ECS deployment circuit breaker was tested using a controlled unhealthy release."
          } >> "$GITHUB_STEP_SUMMARY"
