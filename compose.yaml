services:
  database:
    image: postgres:17-alpine
    container_name: careflow-database
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - careflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migration:
    image: careflow-api:local

    build:
      context: ./application
      dockerfile: Dockerfile

    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION}
      DATABASE_URL: ${COMPOSE_DATABASE_URL}

    depends_on:
      database:
        condition: service_healthy

    command: ["node", "dist/migrate.js"]

    read_only: true

    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    restart: "no"

  application:
    image: careflow-api:local
    container_name: careflow-api
    restart: unless-stopped
    init: true

    environment:
      NODE_ENV: production
      PORT: 3000
      APP_VERSION: ${APP_VERSION}
      DATABASE_URL: ${COMPOSE_DATABASE_URL}

    ports:
      - "3000:3000"

    depends_on:
      database:
        condition: service_healthy

      migration:
        condition: service_completed_successfully

    read_only: true

    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

volumes:
  careflow_postgres_data:
